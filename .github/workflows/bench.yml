name: Embedding Reranker Bench

on:
  pull_request:
    paths:
      - "rag/**"
      - "eval/**"
      - "bench/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:
    inputs:
      commit_results:
        description: "Commit updated RESULTS.md / README bench block to the branch"
        required: false
        default: false
        type: boolean
      run_full_benchmark:
        description: "Run the full local embedding benchmark (CPU; downloads models)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bench/requirements.txt
      - name: Install lightweight test deps
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<9" "PyYAML>=6,<7" "pandas>=2,<3" "numpy>=1.26,<3" "networkx>=3.2,<4" "rank-bm25>=0.2.2,<0.3"
      - name: Run unit tests
        run: python -m pytest bench/tests -q

  benchmark:
    name: CPU benchmark
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 360
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_benchmark == true)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bench/requirements.txt
      - name: Cache Hugging Face hub
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .hf-cache
          key: hf-bench-${{ runner.os }}-${{ hashFiles('bench/configs.yaml', 'bench/requirements.txt') }}
          restore-keys: |
            hf-bench-${{ runner.os }}-
      - name: Install benchmark deps
        run: |
          python -m pip install --upgrade pip
          pip install -r bench/requirements.txt
      - name: Run local configs
        env:
          HF_HOME: ${{ github.workspace }}/.hf-cache
          HUGGINGFACE_HUB_CACHE: ${{ github.workspace }}/.hf-cache
          TRANSFORMERS_CACHE: ${{ github.workspace }}/.hf-cache
        run: |
          mkdir -p .hf-cache
          python -m bench.run_benchmark --all --skip-optional --question-set original
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/
      - name: Commit results (manual dispatch only)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.commit_results == true
        run: |
          python -m bench.update_readme
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/results/ README.md
          if git diff --staged --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "chore(bench): refresh embedding/reranker results"
            git push
          fi
